    - "Chi phí mỗi việc thành công toàn mẫu: 4.472 đ (simulated); theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, doi_tac 10.215 đ, quoc_te 22.515 đ (simulated)"
    - "Chi phí mỗi việc thành công phạm vi noi_dia + hang_nang: 3.414 đ chưa cố định, 4.599 đ khi cộng cố định ở 45.000 yêu cầu/tháng, và 11.743 đ (hoặc 12.414 đ) nếu xem lại 100% (simulated)"
