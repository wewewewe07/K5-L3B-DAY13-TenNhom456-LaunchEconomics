# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: Cần 1.251 yêu cầu mỗi nhóm (dùng z chính xác; hoặc 1.250 nếu làm tròn z=1,96 và 0,84).
#   b) Theo nhân viên, m = 75: DE = 1 + (75 - 1) * 0,02 = 2,48 -> cần 1.251 * 2,48 = 3.103 yêu cầu/nhóm -> 42 nhân viên/nhóm (tổng 84 > 40 nhân viên hiện có: không đủ người).
#   c) 20 nhân viên mỗi nhóm: Cỡ mẫu hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt được mức chênh 5 điểm dù m lớn bao nhiêu).
#   d) 6 depot mỗi nhóm: Cỡ mẫu hiệu dụng tối đa = c / ICC = 6 / 0,02 = 300 < 1.251 (không đạt và số cụm < 20).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: Giải 20*m / (1 + (m - 1)*0,02) >= 859 -> m >= 298,5 -> cần ít nhất 299 yêu cầu mỗi nhân viên (DE = 6,96; tổng 5.980 yêu cầu thô mỗi nhóm).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng và 20 nhân viên nhóm dùng trợ lý làm việc song song trong cùng tuần và cùng các depot.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng script phân tầng theo depot (stratified randomization) với random seed cố định ghi vào biên bản trước ngày chạy.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot hỏi bài nhau; giảm thiểu bằng cách khóa quyền mở trợ lý theo tài khoản staff_id và ghi log kiểm tra chéo.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, ngưỡng MDE 0,06, 3 luật dừng và ngày quyết định 2027-01-05 đều được chốt trong file này trước ngày mở pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, mỗi nhóm có đúng 20 cụm (20 nhân viên nhóm can thiệp và 20 nhân viên nhóm đối chứng).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận nâng mức chênh phát hiện tối thiểu (MDE) từ 0,05 lên 0,06 (6 điểm phần trăm, cần n_eff = 859/nhóm, m >= 299 yêu cầu/nhân viên); nếu tác động thật chỉ đạt +5 điểm thì power giảm từ 0,80 xuống khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Tỉ lệ mo_lai_trong_7_ngay trong dữ liệu chạy thử là 4,25% (51/1.200) trên toàn mẫu và 3,97% (39/982) trong phạm vi noi_dia + hang_nang; do đó không đặt ngưỡng tuyệt đối 3% (sẽ làm dừng oan ngay tuần đầu) mà đặt ngưỡng dừng khi nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ nhận yêu cầu noi_dia (2.696 đ = 0,22x, simulated) và hang_nang (8.221 đ = 0,69x, simulated) tại 12 depot; loại quoc_te (22.515 đ = 1,88x, simulated) và doi_tac (10.215 đ = 0,85x, simulated)"
  assignment:
