    spillover_risk: "Rủi ro nhân viên cùng depot chia sẻ gợi ý; kiểm soát bằng phân quyền tài khoản staff_id và đối soát event agent_suggestion_shown"
    predeclared: "Chỉ số chính, ngưỡng MDE 0,06, 3 luật dừng và ngày ra quyết định 2027-01-05 được khóa trước ngày khởi chạy pilot"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm phần trăm trở lên hoặc vượt trần 6%, hoặc phát sinh từ 1 ca hoàn tiền trùng trở lên TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN tắt cờ trợ lý trong vòng 30 phút KHÔNG THÌ không được phép chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt quá 8.000 đ hoặc tỉ lệ ca phải làm lại vượt quá 7% TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí tạm dừng loại hang_nang để thu hẹp phạm vi về chỉ còn noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được giữ hang_nang trong phạm vi pilot"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý (sửa hoặc bỏ) vượt quá 40% TRONG 1 tuần làm việc THÌ Trưởng nhóm CSKH phải phỏng vấn 5 nhân viên và rà soát 20 trace bị sửa trong vòng 3 ngày KHÔNG THÌ không được nâng tỉ lệ rollout lên bậc tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành LogiX-VN bật cờ tắt trợ lý (feature flag), có hiệu lực toàn hệ thống trong 30 phút; toàn bộ yêu cầu hoàn phí tự động quay về luồng nhân viên CSKH tự xử lý"
